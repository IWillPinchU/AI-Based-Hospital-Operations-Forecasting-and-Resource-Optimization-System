name: Hospital Operations AI CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Python FastAPI Backend Test & Bootstrap Suite
  backend-ci:
    name: Backend Test Suite & Bootstrap Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install CPU-only PyTorch Wheel
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch>=2.0.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install Backend Application Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Verify Automated System Self-Bootstrapping
        run: |
          python backend/scripts/init_system.py

      - name: Execute Full Backend Test Suite
        run: |
          pytest backend/tests -v --durations=10

  # Job 2: Next.js TypeScript Frontend Quality & Build Suite
  frontend-ci:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Run ESLint Verification
        run: npm run lint

      - name: Run TypeScript Strict Type Check
        run: npx tsc --noEmit

      - name: Compile Next.js Production Build
        run: npx next build --webpack
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"

  # Job 3: Docker Compose Deployment Configuration Validation
  docker-validation:
    name: Docker Compose Syntax & Configuration Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Docker Compose Configuration
        run: docker compose config

